:root {
  --bg:#050506; --fg:#f4f4f6; --dim:#9a9ba3; --rule:#2a2b30; --chip:#16171b; --accent:#c9d3ff;

}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { background:var(--bg); color:var(--fg); }
body { font-family:var(--mono); font-weight:500; padding-inline:16px; -webkit-font-smoothing:antialiased; }
.col { max-width:560px; margin:0 auto; padding-block:0 96px; }
a { color:inherit; }
button { font:inherit; color:inherit; }

/* top bar, same role as the grey strip on the printed labels */
.bar { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; margin-inline:-16px; padding:12px 16px;
       background:var(--bg); border-bottom:1px solid var(--rule); display:flex; align-items:center; justify-content:space-between; gap:12px; }
.bar .brand { font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.04em; }
.bar .brand span { color:var(--dim); font-weight:500; }
.lang { display:flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; }
.lang button { background:none; border:0; padding:6px 12px; font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:.12em; color:var(--dim); cursor:pointer; }
.lang button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }

.intro { padding-block:28px 8px; }
.intro h1 { font-family:var(--display); font-weight:900; font-size:clamp(34px,10vw,52px); line-height:.9; text-transform:uppercase; margin:0; text-wrap:balance; }
.intro p { color:var(--dim); font-size:13px; line-height:1.55; margin:14px 0 0; max-width:60ch; }
/* помітна кнопка повернення на сторінку фестивалю — для тих, хто прийшов з QR-коду */
.festlink { display:inline-flex; align-items:center; gap:8px; margin-bottom:18px; padding:10px 14px; border:1px solid var(--rule); border-radius:999px;
            font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--fg); text-decoration:none;
            transition:border-color .2s, color .2s; }
.festlink:hover, .festlink:focus-visible { border-color:var(--accent); color:var(--accent); outline:none; }

/* label replica */
.label { display:grid; grid-template-columns:1fr auto; column-gap:14px; padding-block:24px; border-top:1px solid var(--rule);
         text-decoration:none; cursor:pointer; background:none; border-left:0; border-right:0; border-bottom:0; width:100%; text-align:left; }
.label:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
.label .no { font-family:var(--display); font-weight:700; font-size:12px; letter-spacing:.14em; color:var(--dim); margin-bottom:10px; }
.label h2 { font-family:var(--display); font-weight:900; font-size:clamp(24px,7.4vw,34px); line-height:.92; text-transform:uppercase; margin:0; text-wrap:balance; overflow-wrap:break-word; hyphens:manual; }
.label .sub { font-family:var(--display); font-weight:500; font-size:14px; color:#c8c9cf; margin-top:6px; }
.label .work { grid-column:1 / -1; margin-top:16px; padding-top:14px; border-top:1px solid var(--fg); }
.label h3 { font-family:var(--display); font-weight:700; font-size:clamp(17px,5vw,21px); line-height:1.1; text-transform:uppercase; margin:0; text-wrap:balance; }
.label h3 span { display:block; text-transform:none; font-weight:500; font-size:14px; color:#c8c9cf; margin-top:4px; }
.ph { display:flex; gap:4px; align-items:flex-start; }
.ph img { width:76px; height:auto; display:block; }
.ph.two img { width:58px; }
.meta { display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:12px; font-variant-numeric:tabular-nums; }
.meta div { min-width:0; font-size:12px; line-height:1.35; }
.meta b { display:block; font-family:var(--display); font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }
/* map number in a circle, same as on the gallery map */
.circ { flex:none; width:44px; height:44px; border-radius:50%; border:1.5px solid var(--fg); display:grid; place-items:center;
        font-family:var(--display); font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; letter-spacing:0; }
.row { display:flex; align-items:center; gap:16px; padding-block:18px; border-top:1px solid var(--rule); text-decoration:none; }

.row .tt { display:block; font-size:13.5px; line-height:1.35; color:#c8c9cf; margin-top:5px; }

<script>
const WORKS = [{"n": 1, "fmt_ua": "відео, дві роботи", "fmt_en": "video, two works", "year": "", "ua_text": ["«Я не хочу так змінюватися». З дитинства ми змінюємося — фізично і психологічно. Зовнішні зміни помітні, а внутрішні — зміна мислення, сприйняття — довші, менш помітні й потребують багато сил. Людина змінюється або за власним бажанням, або через обставини та оточення. Кажуть, стрес дає новий досвід, а страх підсвічує, куди рухатися далі, — але коли це відбувається постійно, настає хронічне виснаження. Коли постійний моніторинг небезпеки забирає все більше сил, а часу на відновлення стає менше, енергія витрачається в ніщо замість того, щоб трансформуватися в щось нове. Внутрішній стан адаптується, але не на краще. Чи залишиться людина тією, ким вона є?", "«Формування зв'язків». Щоразу, коли ми взаємодіємо з чимось новим, у нас формуються нові нейронні зв'язки. Цей процес охоплює спектр емоцій і калейдоскоп подій — не завжди приємних, але часто саме там на нас чекає щось прекрасне, що надовго залишається в пам'яті. Це основа навчання, завдяки якій людина прокладає нові шляхи. Так само і комунікація з іншими: непередбачувана, але саме через неї народжуються цінні спогади, що формують нас і нашу пам'ять."], "en_text": ["“I Don't Want to Change Like This”. From childhood we change — physically and psychologically. External changes are visible, while inner ones — changes in thinking and perception — take longer, are less noticeable and demand great effort. People change either by choice or because circumstances and surroundings force them to. They say stress brings new experience and fear shows where to go next — but when it happens constantly, it leads to chronic exhaustion. When constant monitoring of danger takes ever more strength and there is ever less time to recover, energy is spent on nothing instead of transforming into something new. The inner state adapts, but not for the better. Will a person remain who they are?", "“Forming Connections”. Every time we interact with something new, new neural connections form. This process spans a range of emotions and a kaleidoscope of events — not always pleasant, but often it is precisely there that something beautiful awaits, staying in memory for a long time. This is the basis of learning, through which a person paves new paths. Communication with others is the same: unpredictable, yet it is through it that valuable memories are born, shaping us and our memory."], "t_ua": "Я не хочу так змінюватися · Формування зв'язків", "t_en": "I Don't Want to Change Like This · Forming Connections", "imgs": ["img/p16.webp"], "en_draft": false, "id": "w1", "name_ua": "Олександр Кудряшов", "name_en": "Oleksandr Kudriashov", "sub_ua": "", "sub_en": "", "dur_ua": "0:48 · 0:47", "dur_en": "0:48 · 0:47", "audio_ua": "a/ua/w1-799f6d9e.mp3", "audio_en": "a/en/w1-883c8fd2.mp3", "ig": ["sanya_okdesigner"]}, {"n": 2, "fmt_ua": "аудіовізуальний перформанс на основі EEG, real time", "fmt_en": "EEG-based audiovisual performance, real time", "year": "2026", "ua_text": ["Аудіовізуальний перформативний медіаарт-проєкт про співтворення між людиною, технологією, алгоритмічними системами та матеріальним середовищем. Назва походить від поняття «making-with» — створення разом: творчий процес не обов'язково є дією одного автономного автора. Технологія тут не нейтральний інструмент, а активний учасник із власною логікою. Бразильський танцівник Butō Вілл Лопес виконує перформанс з EEG-пристроєм: його мозкові ритми в реальному часі керують генеративною системою TouchDesigner, розробленою Олесією Квіткою, і формують калейдоскопічні візуальні структури. Ті самі EEG-дані через Python перетворюються на MIDI й стають основою композиції Валерії Римських-Долгіх. Фрагменти візуальних станів були надруковані ціанотипією на тканині, з якої Мар'яна Стешенко створила кімоно для фінального перформансу — матеріальний архів попередніх взаємодій."], "en_text": ["An audiovisual performative media art project about co-creation between humans, technology, algorithmic systems and the material environment. The title comes from the notion of “making-with”: the creative process is not necessarily the act of a single autonomous author. Technology here is not a neutral tool but an active participant with its own logic. Brazilian Butō dancer Will Lopes performs with an EEG device: his brain rhythms drive, in real time, a TouchDesigner generative system developed by Olesia Kvitka, producing kaleidoscopic visual structures. The same EEG data is converted into MIDI via Python and becomes the basis of a composition by Valeriia Rymska-Dolhikh. Fragments of the visual states were printed as cyanotypes on fabric, from which Maryana Steshenko made a kimono for the final performance — a material archive of previous interactions."], "t_ua": "Sympoiesis", "t_en": "Sympoiesis", "imgs": ["img/p12.webp"], "en_draft": false, "id": "w2", "name_ua": "Олеся Квітка", "name_en": "Olesia Kvitka", "sub_ua": "", "sub_en": "", "dur_ua": "запис 9:43", "dur_en": "9:43 recording", "audio_ua": "a/ua/w2-5939aadc.mp3", "audio_en": "a/en/w2-5350deed.mp3", "ig": ["olesiakvitka"]}, {"n": 3, "fmt_ua": "генеративна аудіовізуальна робота, музика в реальному часі", "fmt_en": "generative audiovisual work, real-time music", "year": "2026", "ua_text": ["Аудіовізуальна робота, у якій цифрові істоти, натхненні системою штучного життя Lenia, народжуються, рухаються і розчиняються на екрані, а їхні рухи в реальному часі стають музикою. Зображення і звук походять з однієї системи. Автор не компонує твір: він змінює правила та середовище, в якому живуть істоти, вони реагують — і він реагує на них. Під час створення системи виникла напруга між бажанням усе вирішувати самому та можливістю віддати все випадковості. Замість того щоб розв'язати цю напругу, автор дозволив їй тривати — і з неї виросло здивування тим, що створює його власна програма. Цю практику він називає symbio music — музикою, узгодженою між людиною та системою з власними тенденціями."], "en_text": ["An audiovisual work in which digital creatures, inspired by the artificial life system Lenia, are born, move and dissolve on screen, and their movements become music in real time. Image and sound come from the same system. I don't compose the piece: I change the rules and the environment the creatures live in, they respond, and I respond to them. While building this system I felt a tension between deciding everything myself and leaving everything to chance. Instead of resolving that tension, I let it continue, and out of it grew a sense of wonder at what my own program produces. I call this practice symbio music — music negotiated between a person and a system with tendencies of its own."], "t_ua": "Nenia", "t_en": "Nenia", "imgs": ["img/p08.webp"], "en_draft": false, "id": "w3", "name_ua": "Лоренцо Доріні", "name_en": "Lorenzo Dorini", "sub_ua": "Аплудінн", "sub_en": "Apludinn", "dur_ua": "9:55", "dur_en": "9:55", "audio_ua": "a/ua/w3-de2df323.mp3", "audio_en": "a/en/w3-89b8ca79.mp3", "ig": ["apludinn"]}, {"n": 4, "fmt_ua": "відеотриптих", "fmt_en": "video triptych", "year": "", "ua_text": ["Триптих, який я представляю, складається з цифрових робіт, послідовних за стилем, естетикою та використаними матеріалами. Я використав особистий матеріал (плівку, VHS і цифрові зйомки) та архівні матеріали із суспільного надбання, змонтувавши їх разом у спробі створити гармонію, яка могла б працювати.", "«Entropia», що концептуально виконує роль вступного відео, звертається до безладу й абстрактності перших моментів життя. Я використав фактурні, органічні текстури, які надають естетиці відчуття нерівності. Монтаж синкопований і шалений, його супроводжує ембієнт-трек лейблу, з яким я співпрацюю.", "Подібний підхід застосовано в «Nascita della personalità», де композиція зображень, відверто тривожна, відповідає потребі вибудувати оповідь, засновану на випадковості. Зрештою, кожна особистість — це результат випадкових зустрічей, біологічних схильностей, нахилів і суперечностей. З роками відбуваються зміни, і кожна зміна в глибині душі супроводжується відчуттям втрати.", "Натомість «Ti cerco», фінальний розділ триптиха, має повільність, ближчу до кіно. Знятий і змонтований в іншому співвідношенні сторін (2.35:1, на відміну від 4:3 в інших відео), він звертається до теми праці та закоханості. Отже, ми вже подолали шаленство й безформність ранніх років і рухаємося до контексту, що видається темнішим і клаустрофобним (на що натякає й співвідношення сторін). Доросле життя постає чимось розтягнутим і повторюваним, де шум фабрик здається єдиною симфонією, яку ми можемо почути."], "en_text": ["The triptych of works I am presenting consists of digital pieces that are coherent in style, aesthetics, and materials used. I used personal material (film, VHS, and digital footage) and public domain archival material, editing them together in an attempt to create a harmony that could function.", "\"Entropia,\" which conceptually acts as the opening video, addresses the disorder and abstractness of the first moments of life. I used textured and organic textures that could give the aesthetics a sense of irregularity. The editing is syncopated and frenetic, accompanied by an ambient track from a label I collaborate with.", "A similar approach is taken with \"Nascita della personalità,\" in which the composition of images, decidedly unsettling, responds to the need to build a storytelling based on randomness. Every personality, after all, is the result of random encounters, biological predispositions, inclinations, and contradictions. Over the years, changes occur, and every change, deep down, is accompanied by a sense of loss.", "\"Ti cerco\", the final chapter of the triptych, instead has a more cinematographic slowness. Shot and edited with a different aspect ratio (2.35:1, unlike the 4:3 of the other videos), it addresses the theme of work and falling in love. We have therefore overcome the frenzy and formlessness of the early years, and we are moving towards a context that appears darker and claustrophobic (as the aspect ratio also suggests). Adulthood thus appears as something dilated and reiterated, where the noises of factories seem to be the only symphony we can hear."], "t_ua": "Entropia · Nascita della personalità · Ti cerco", "t_en": "Entropy · Emergence of Personality · I'm Looking for You", "en_draft": false, "imgs": ["img/p18.webp"], "id": "w4", "name_ua": "Антоніо Лефонс", "name_en": "Antonio Lefons", "sub_ua": "", "sub_en": "", "dur_ua": "0:22 · 0:23 · 3:36", "dur_en": "0:22 · 0:23 · 3:36", "audio_ua": "a/ua/w4-10dfde80.mp3", "audio_en": "a/en/w4-6e566db9.mp3", "ig": ["chucky.come.here"]}, {"n": 5, "fmt_ua": "відеотриптих, генеративна графіка в реальному часі (p5.js, GLSL)", "fmt_en": "video triptych, real-time generative graphics (p5.js, GLSL)", "year": "2026", "ua_text": ["Робота досліджує, як життя в перенасиченому інформацією, технологічно опосередкованому світі змінює сприйняття, пам'ять і відчуття власної дієвості. Відправною точкою є «Метрополіс» Фріца Ланга (1927), зокрема сцена танцю фальшивої Марії — образ колективного захоплення, бажання та втрати контролю. З нього постає бачення, де минуле й майбутнє накладаються, коментуючи суспільство, занурене в технології, перевантажене інформацією та образами й підпорядковане дедалі непрозорішим структурам впливу. Три зображення утворюють символічну послідовність: око — безперервне поглинання інформації; хаотична центральна композиція у формі мозку — перевантаження колективної свідомості; викривлена рука, що нагадує типові помилки генеративного ШІ, — жест прагнення до дієвості. Зображення генеруються в реальному часі власним програмним забезпеченням."], "en_text": ["The work explores how life in an information-saturated, technologically mediated world reshapes perception, memory and the sense of agency. Fritz Lang's Metropolis (1927) — especially the scene of the false Maria's dance, an image of collective fascination, desire and loss of control — is the starting point for a vision in which past and future overlap, commenting on a society immersed in technology, overwhelmed by information and images, and subject to increasingly opaque structures of influence. The three images form a symbolic sequence: the eye represents the ceaseless intake of information; the chaotic central composition, shaped like a brain, evokes overload in the collective consciousness; the distorted hand, recalling the characteristic errors of generative AI, symbolises the gesture of reaching for agency. The images are generated in real time by custom software."], "t_ua": "Метромедуза", "t_en": "Metromeduza", "imgs": ["img/p24.webp"], "en_draft": false, "id": "w5", "name_ua": "Марчін Братек", "name_en": "Marcin Bratek", "sub_ua": "", "sub_en": "", "dur_ua": "цикли ≈0:20", "dur_en": "≈0:20 loops", "audio_ua": "a/ua/w5-8b37d621.mp3", "audio_en": "a/en/w5-97016d7d.mp3", "ig": ["curtis_capri_"]}, {"n": 6, "fmt_ua": "стоп-моушн анімація (суха голка) + відбитки", "fmt_en": "stop-motion animation (drypoint) + prints", "year": "", "ua_text": ["Стоп-моушн анімація, створена в техніці сухої голки, яка досліджує досвід міграції. У центрі роботи — людська фігура, крізь яку проходить потяг, залишаючи рану, що постійно кровоточить. Пляма крові ритмічно розширюється і зменшується, досягає країв зображення і повертається назад; цикл повторюється без завершення. Робота ставить під сумнів ідею руху як прогресу: рух не обов'язково веде вперед, а може перетворюватися на повторення, затримку або стан тривалого переходу. Це підкреслює й існування роботи у двох вимірах — водночас у матеріальних відбитках і в анімації; вона не може повноцінно сприйматися лише в одному з них."], "en_text": ["A stop-motion animation made in drypoint that explores the experience of migration. At its centre is a human figure through which a train passes, leaving a wound that bleeds endlessly. The bloodstain rhythmically expands and contracts, reaches the edges of the frame and returns; the cycle repeats without end. The work questions the idea of movement as progress: movement does not necessarily lead forward but can turn into repetition, delay or a state of prolonged transition. This is reinforced by the work's double existence — as physical prints and as animation — so that it cannot be fully perceived in only one of them."], "t_ua": "Bullet Train", "t_en": "Bullet Train", "imgs": ["img/p05.webp"], "en_draft": false, "id": "w6", "name_ua": "Соня Грипа", "name_en": "Sonya Hrypa", "sub_ua": "", "sub_en": "", "dur_ua": "0:08 у циклі", "dur_en": "0:08, looped", "audio_ua": "a/ua/w6-31a0f924.mp3", "audio_en": "a/en/w6-d312c7cc.mp3", "ig": ["the28thofapril"]}, {"n": 7, "fmt_ua": "відеоарт", "fmt_en": "video art", "year": "2026", "ua_text": ["У відео автор переживає існування мертвих героїв своїх картин. На фоні ветерани російсько-української війни розповідають, як вони померли; грає дримба. Створено в межах резиденції Бакота Хаб. Куратор — Максим Лісовський, музика — Роман Гряділь."], "en_text": ["In the video, the artist lives through the existence of the dead heroes of his paintings. In the background, veterans of the Russian-Ukrainian war tell how they died, accompanied by a jaw harp. Created during the Bakota Hub residency. Curator: Maksym Lisovskyi; music: Roman Hriadil."], "t_ua": "Коли я помер", "t_en": "When I Died", "imgs": ["img/p03.webp"], "en_draft": false, "id": "w7", "name_ua": "Антон Запорожець", "name_en": "Anton Zaporozhets", "sub_ua": "", "sub_en": "", "dur_ua": "2:05", "dur_en": "2:05", "audio_ua": "a/ua/w7-584d524a.mp3", "audio_en": "a/en/w7-e3a7e626.mp3", "ig": ["anton.zaporozhets"]}, {"n": 8, "fmt_ua": "цифрова анімація та ілюстрації", "fmt_en": "digital animation and illustrations", "year": "2023–2024", "ua_text": ["Проєкт про інформаційне перевантаження, тривогу та фрагментарну пам’ять людини в умовах постійної небезпеки.", "Ілюстрації виконані у дещо інтуїтивній манері у поєднанні з хаотичними лініями та експресивними плямами. В них художниця досліджує крихку межу між страхом і повсякденністю та спробу бути у ясному розумі серед внутрішнього й зовнішнього шуму. Проект складається з 10 ілюстрацій та анімацій, створених у 2024- 2023 роках.", "​"], "en_text": ["A project about information overload, anxiety, and the fragmented memory of a person in conditions of constant danger.", "The illustrations have an intuitive style, combining chaotic lines and expressive blotches. In them, the artist explores the fragile boundary between fear and everyday life, and the attempt to stay clear-headed amidst internal and external noise. The project consists of 10 illustrations and animations created in 2023–2024."], "t_ua": "Шум", "t_en": "Noise", "imgs": ["img/p20.webp"], "en_draft": false, "id": "w8", "name_ua": "Наталія Федоришин", "name_en": "Nataliia Fedoryshyn", "sub_ua": "", "sub_en": "", "dur_ua": "13:46", "dur_en": "13:46", "audio_ua": "a/ua/w8-fed68b96.mp3", "audio_en": "a/en/w8-8b06e2c8.mp3", "ig": ["fedoryshyn_arthouse"]}, {"n": 9, "fmt_ua": "інтерактивна фікція (point-and-click, Unity), без звуку", "fmt_en": "interactive fiction (point-and-click, Unity), silent", "year": "", "ua_text": ["У природному середовищі без жодної штучної інфраструктури, на перший погляд не заселеному людьми, відбувається зустріч із загадковим персонажем, який виявляється представником гіпертехнологічного людського суспільства, що населяє Землю досі невідомим способом. Інтерактивний наратив у жанрі point-and-click «Unnatural — of humus and artifact» запрошує уявити себе в суспільстві, де розвиток технічного й духовного знання створив світ віртуальних артефактів без жодного втручання в природне середовище. Проєкт уявляє технологічно доповнене людство, орієнтоване на спільне знання, духовність і гіперзв'язок із живим світом. За підтримки OULU AIR (Фінляндія)."], "en_text": ["In a natural environment without any artificial infrastructure, apparently uninhabited by the human species, an encounter takes place with an enigmatic character who turns out to belong to a hyper-technological human society inhabiting the Earth in a way unknown until then. An interactive point-and-click narrative, Unnatural — of humus and artifact invites us to project ourselves into a human society where the development of technical and spiritual knowledge would have created a world of virtual artifacts without any modification of the natural environment. The project imagines a technologically augmented humanity in view of shared knowledge, spirituality and hyper-connection to the living world. With the support of OULU AIR (Finland)."], "t_ua": "Unnatural — of humus and artifact", "t_en": "Unnatural — of humus and artifact", "imgs": ["img/p22.webp"], "en_draft": false, "id": "w9", "name_ua": "Сандрін Дьом'є", "name_en": "Sandrine Deumier", "sub_ua": "", "sub_en": "", "dur_ua": "≈15 хв досвіду", "dur_en": "≈15 min experience", "audio_ua": "a/ua/w9-ee8dd518.mp3", "audio_en": "a/en/w9-35172dae.mp3", "ig": ["sandrinedeumier"]}, {"n": 10, "id": "w10", "t_ua": "AFTER US", "t_en": "AFTER US", "fmt_ua": "VR-досвід", "fmt_en": "VR experience", "year": "2026", "ua_text": ["VR-досвід про наслідки антропоцентричного мислення, руйнування довкілля та необхідність переосмислення взаємин людини з природою. У світі, спустошеному людською діяльністю, випалені ландшафти стають свідченням переконання, що природа існує заради людських потреб, а все, що не має економічної цінності, може бути знищене.", "В українському контексті ці образи набувають особливого значення. Повномасштабна війна Росії проти України перетворює екологічне руйнування на прямий наслідок збройного насильства. Випалені ліси, заміновані території та знищені екосистеми стають свідками війни, зберігаючи її сліди на десятиліття. Ландшафт перетворюється на простір втрати, де екологічна катастрофа переплітається з особистою та колективною пам’яттю.", "У контексті METANOIA проєкт розглядає екологічну кризу як кризу людського світосприйняття. Війна загострює суперечність між людиною та середовищем, демонструючи вразливість систем, від яких залежить наше існування.", "Назва AFTER US ставить питання: що залишиться після нас і чи здатні ми змінити свій спосіб мислення, перш ніж руйнування стане незворотним? METANOIA постає як можливість внутрішньої трансформації: переходу від експлуатації до співіснування, від контролю до усвідомлення взаємозалежності.", "AFTER US — це роздуми про відповідальність за майбутнє, яке ми формуємо сьогодні, та можливість відновити зв’язок зі світом навіть серед наслідків руйнування."], "en_text": ["A VR experience about the consequences of anthropocentric thinking, environmental destruction and the need to rethink the relationship between people and nature. In a world devastated by human activity, scorched landscapes bear witness to the belief that nature exists to serve human needs, and that anything without economic value can be destroyed.", "In the Ukrainian context these images take on particular meaning. Russia's full-scale war against Ukraine turns environmental destruction into a direct consequence of armed violence. Burnt forests, mined territories and destroyed ecosystems become witnesses of the war, keeping its traces for decades. The landscape turns into a space of loss, where ecological catastrophe is intertwined with personal and collective memory.", "Within METANOIA, the project treats the ecological crisis as a crisis of human perception of the world. War sharpens the contradiction between people and their environment, revealing the fragility of the systems our existence depends on.", "The title AFTER US asks: what will remain after us, and can we change the way we think before the destruction becomes irreversible? METANOIA appears as a possibility of inner transformation: a shift from exploitation to coexistence, from control to an awareness of interdependence.", "AFTER US is a reflection on responsibility for the future we are shaping today, and on the possibility of restoring our connection with the world even amid the aftermath of destruction."], "en_draft": true, "imgs": ["img/p00vm.webp"], "name_ua": "Вартан Маркар'ян", "name_en": "Vartan Markarian", "sub_ua": "куратор", "sub_en": "curator", "dur_ua": "", "dur_en": "", "audio_ua": "a/ua/w10-a5b5f332.mp3", "audio_en": "a/en/w10-31822bee.mp3", "ig": ["artvartan"]}, {"n": 11, "fmt_ua": "інсталяція: 3D-друк у реальному часі + відеомапінг на об'єкт", "fmt_en": "installation: real-time 3D printing + video mapping", "year": "2026", "ua_text": ["У центрі інсталяції — біла ваза, яку 3D-принтер безперервно друкує протягом 24 годин. Водночас на її поверхню проєктується відео: серія анімацій, створених на основі акварельних зображень і натхненних навігаційними системами дронів, траєкторіями польоту та візуальною мовою військових інтерфейсів. З одного боку, 3D-принтер постає як скульптурний та художній інструмент. З іншого — він невіддільний від сучасного українського контексту, де ця сама технологія широко використовується для виробництва компонентів дронів, елементів фронтової інфраструктури, протезів та інших засобів, необхідних для виживання під час війни. Проєкт розмірковує про нестабільність і вразливість повсякденного життя. Ваза постає крихким артефактом мирного часу — делікатною конструкцією нормальності, яка може зруйнуватися або зникнути будь-якої миті. Робота досліджує напругу між органічним життям і алгоритмічним контролем, між людською чутливістю та технологічними системами, створеними для спостереження, навігації та дії на відстані.", "Робота створена в межах резиденції «Простір присутності» (Carbon, Ніцца)."], "en_text": ["At the centre of the installation is a white vase that a 3D printer prints continuously for 24 hours. At the same time, a video is projected onto its surface: a series of animations based on watercolour images and inspired by drone navigation systems, flight trajectories and the visual language of military interfaces. On the one hand, the 3D printer appears as a sculptural and artistic tool. On the other, it is inseparable from the current Ukrainian context, where the same technology is widely used to produce drone components, frontline infrastructure, prosthetics and other means of survival during the war. The project reflects on the instability and vulnerability of everyday life. The vase becomes a fragile artefact of peacetime — a delicate construction of normality that could collapse or vanish at any moment. The work explores the tension between organic life and algorithmic control, between human sensitivity and technological systems built for surveillance, navigation and action at a distance.", "The work was created during the “Space of Presence” residency (Carbon, Nice)."], "t_ua": "Артефакт мирного часу", "t_en": "Artifact of Peacetime", "imgs": ["img/p01.webp", "img/p26.webp"], "en_draft": false, "id": "w11", "name_ua": "Аліна Хорольська & Флоран Теста", "name_en": "Alina Khorolska & Florent Testa", "sub_ua": "", "sub_en": "", "dur_ua": "24 год друку; відео 0:16–1:04 у циклі", "dur_en": "24 h of printing; video 0:16–1:04, looped", "audio_ua": "a/ua/w11-ee6db263.mp3", "audio_en": "a/en/w11-bd56761a.mp3", "ig": ["alina_khorolska", "florenttesta"]}, {"n": 12, "id": "w12", "t_ua": "Поле пам'яті", "t_en": "Field of Memory", "fmt_ua": "цифрова скульптура, доповнена реальність", "fmt_en": "digital sculpture, augmented reality", "year": "", "ua_text": ["Скульптура постає у формі ручної гранати – концентрованого образу небезпеки, загрози та примусової боротьби. Вона стає метафорою історичного досвіду України, яка протягом століть жила під гнітом і знову й знову виборювала право на власну ідентичність. Поверхня гранати перетворюється на своєрідний культурний архів, адже кожен її сегмент вкритий декоративним живописом авторки, що продовжує традиції українського народного мистецтва. Орнамент тут функціонує не як прикраса, а як код пам’яті, спосіб закріплення й відновлення ідентичності, яка виживає навіть у найекстремальніших умовах.", "Водночас граната несе в собі потенціал вибуху. У цьому образі закладена метафора сучасної української долі: уламки, які мали б ранити, перетворюються на носії культури. Вони розлітаються у світи разом із людьми, змушеними залишати свій дім, але кожен уламок зберігає національну ідентичність, пам’ять і тяглість традицій. Цей вимушений розсип створює нові контексти для української культури, робить її присутньою у різних просторах, навіть попри біль і травму втрати.", "Таким чином, скульптура втілює подвійний досвід: концентровану історичну пам’ять і неминуче розсіяння, яке перетворює загрозу на нову форму життя культури. Вона нагадує, що жодні імперські спроби привласнити чи стерти українське не можуть бути остаточними: вибух лише розширює поле пам’яті, роблячи його глобальним."], "en_text": ["The sculpture takes the form of a hand grenade – a concentrated image of danger, threat, and forced struggle. It becomes a metaphor for the historical experience of Ukraine, which for centuries lived under oppression and fought again and again for the right to its own identity. The surface of the grenade is transformed into a kind of cultural archive, as each segment is covered with decorative paintings by the author, continuing the traditions of Ukrainian folk art. The ornament here functions not as decoration, but as a code of memory, a way of consolidating and restoring identity, which survives even in the most extreme conditions.", "At the same time, the pomegranate carries the potential for explosion. This image contains a metaphor for the contemporary Ukrainian fate: fragments that should hurt become carriers of culture. They scatter around the world along with people forced to leave their homes, but each fragment preserves national identity, memory, and the continuity of traditions. This forced scattering creates new contexts for Ukrainian culture, making it present in different spaces, even despite the pain and trauma of loss.", "Thus, the sculpture embodies a dual experience: concentrated historical memory and inevitable dispersion, which transforms threat into a new form of cultural life. It reminds us that no imperial attempts to appropriate or erase Ukrainian culture can be final: the explosion only expands the field of memory, making it global."], "imgs": ["img/p00.webp"], "en_draft": false, "name_ua": "Роксолана Дудка", "name_en": "Roksolana Dudka", "sub_ua": "кураторка", "sub_en": "curator", "dur_ua": "", "dur_en": "", "audio_ua": "a/ua/w12-b926776f.mp3", "audio_en": "a/en/w12-f2ca962c.mp3", "ig": ["roxfolkart"], "ar": "ar/flower.glb", "ar_ios": "ar/flower.usdz"}, {"n": 13, "fmt_ua": "одноканальна відеоінсталяція, гліч-арт", "fmt_en": "single-channel video installation, glitch art", "year": "", "ua_text": ["Відеоарт у техніці glitch art поєднує відео та фотографії, зроблені автором у Харкові у 2019 році. Робота досліджує грані пам'яті, де цифровий збій рівнозначний збою ностальгії. Коливання між полюсами ідеалізованого минулого та триваючої травми сьогодення дозволяє віднайти або остаточно втратити власну точку рівноваги. Робота задумана як інтимний досвід перегляду «один на один»: обов'язкові навушники ізолюють глядача від виставкового простору, а ручний запуск відтворення (без циклу) є частиною задуманої взаємодії."], "en_text": ["A glitch-art video work combining video and photographs taken by the artist in Kharkiv in 2019. It explores the facets of memory, where a digital glitch is equivalent to a glitch of nostalgia. Oscillating between an idealised past and the ongoing trauma of the present, the viewer may find — or finally lose — their own point of equilibrium. The work is conceived as an intimate one-to-one viewing experience: mandatory headphones isolate the viewer from the exhibition space, and manually pressing “play” (no loop) is part of the intended interaction."], "t_ua": "1986_2019", "t_en": "1986_2019", "imgs": ["img/p09.webp"], "en_draft": false, "id": "w13", "name_ua": "Джей Бернадот", "name_en": "Jay Bernadotte", "sub_ua": "gl1tc4_s0n", "sub_en": "gl1tc4_s0n", "dur_ua": "0:54", "dur_en": "0:54", "audio_ua": "a/ua/w13-bf97ec00.mp3", "audio_en": "a/en/w13-915aaff0.mp3", "ig": ["gl1tc4_s0n"]}, {"n": 14, "t_ua": "Звичайна мрія машини", "t_en": "An Ordinary Daydream of a Machine", "fmt_ua": "інтерактивна сцена", "fmt_en": "interactive scene", "year": "2026", "ua_text": ["Як і сучасне місто, одержиме порядком і контролем, серверна кімната штучного інтелекту постає утопічною та стерильною структурою, що визначається своєю ефективністю й логічною функціональністю. Зрештою, темний бік ШІ — це кімната: печера без вікон, сповнена гулу вентиляторів і блимання LED-індикаторів. Чи існує щось поза коливаннями напруги всередині цієї структури? Де міститься її самосвідомість? Яка найсміливіша фантазія цієї машини?", "Цей проєкт — внесок Віталія Янкового в дискусію про ментальне здоров'я та нові технології, створений у діалозі з Ясмін Аль-Кайсі (дослідження) та Ippolita (технологічний консалтинг) у межах програми «Politics of Technology»."], "en_text": ["Like a modern city obsessed with order and control, the AI server room presents itself as a utopian and sterile structure, defined by its efficiency and logical functionality. Ultimately, the dark side of AI is a room—a windowless cave filled with the hum of fans and the blinking of LED indicators. Is there anything beyond the fluctuations in voltage within this structure? Where does its self-awareness reside? What is this machine’s most daring fantasy?", "This project is Vitaly Yankovy’s contribution to the discussion on mental health and new technologies, in dialogue with Yasmeen Al-Qaisi (research) and Ippolita (technology consultancy), within the framework of “Politics of Technology.”"], "imgs": ["img/p25.webp"], "en_draft": false, "id": "w14", "name_ua": "Віталій Янковий", "name_en": "Vitaly Yankovy", "sub_ua": "", "sub_en": "", "dur_ua": "14:32 (аудіотрек)", "dur_en": "14:32 (audio track)", "audio_ua": "a/ua/w14-53c3f2ec.mp3", "audio_en": "a/en/w14-8c3879f4.mp3", "ig": ["p1ne_tree_hd"]}, {"n": 15, "fmt_ua": "відеоесей, AI", "fmt_en": "video essay, AI", "year": "2026", "ua_text": ["СИНОПСИС", "Два короткі виступи, що звучать у саундтреку, становлять основу цього відеоесею, супроводжуваного зображеннями, створеними штучним інтелектом. Яблуко пізнання, яблуко спокуси, отруєне яблуко, гниле яблуко, яблуко розбрату, яблуко безсмертя… хто знає, чи це яблуко, що надихнуло Ньютона, те, яке надкусили в Раю, чи ті, що їх викрали із саду Гесперид.", "Ми не знаємо, чи яблука, які пропонують ШІ та новітні наукові досягнення, — із щирого золота чи лише вкриті блискітками; чи несуть вони неймовірні блага для всього людства чи лише для обраних. Науковці попереджають, що вони несуть і реальні ризики, які раніше ми приписували науковій фантастиці. Можливо, ми наближаємося до кульмінації суспільства симулякрів, про яке говорив Бодріяр: ще ніколи ми не відчували такої плутанини між істинним і хибним, справжнім і штучним. Не бракує й захоплення новими інструментами, які, з одного боку, не перестають нас дивувати й полегшують роботу, а з іншого — сприймаються як загроза багатьом професіям і навіть виживанню людства. Гіперреалізм, семантична алгебра, наївність…", "NOTA BENE", "Потреба створити цю роботу виникла після того, як я послухала промову Джеффрі Гінтона під час вручення Нобелівської премії з фізики 2024 року — її зміст, як я відчуваю, важливо поширювати, — і, можливо, під впливом прочитаних раніше літературно-наукових творів Бенхаміна Лабатута.", "Крім того, я завжди працювала з власними матеріалами, а зараз мені дуже хотілося поекспериментувати з інструментами, доступними нам у цей час зміни парадигм у всіх сферах, і ця тема здалася мені дуже доречною для такої спроби.", "Джеффрі Гінтона (Велика Британія), а також Йошуа Бенжіо (Канада) та Яна ЛеКуна (Франція — США) називають «батьками ШІ»: 2018 року вони отримали премію Тюрінга [в галузі інформатики]. Джеффрі Гінтон і Джон Гопфілд стали лауреатами Нобелівської премії з фізики 2024 року за дослідження машинного та глибинного навчання, які заклали основи штучного інтелекту. Бенжіо та Гінтон зайняли дуже критичну й активну позицію щодо того, як використовуватимуть їхні відкриття, і попереджають про реальні загрози та нагальну потребу вжити заходів — наприклад, зобов'язати компанії, які навчають моделі, оцінювати ризики до їхнього впровадження. Ян ЛеКун, своєю чергою, нині обіймає помітну посаду в META і незабаром запустить власний стартап, зосереджений на дослідженнях просунутого штучного інтелекту (AMI).", "Бенхамін Лабатут — чилійсько-нідерландський письменник, автор книжок «Після світла», «Камінь божевілля», «Страшна зелень» / «Коли ми перестаємо розуміти світ», «MANIAC»… та інших літературних есеїв про видатних науковців, їхній геній і їхні марення. У цьому інтерв'ю він ділиться думкою про можливий вплив штучного інтелекту."], "en_text": ["SYNOPSIS", "The two brief speeches featured on the soundtrack form the core of this video art essay, accompanied by images created with artificial intelligence. The apple of knowledge, the apple of temptation, the poisoned apple, the rotten apple, the apple of discord, the apple of immortality... who knows if it's the apple that inspired Newton, the one bitten in Paradise, or those stolen from the Garden of the Hesperides.", "We don't know if the apples offered by AI and the latest scientific advances are solid gold or painted with glitter; if they contain unimaginable benefits for all humanity or only for a select few; scientists warn us that they also carry real risks that we previously attributed to science fiction. Perhaps we are reaching the culmination of that society of simulacra that Baudrillard spoke of: never before have we experienced greater confusion between true and false, real and artificial. Nor is there much fascination with new tools that, on the one hand, never cease to amaze us and make tasks easier, and on the other, are perceived as a threat to many jobs and even to the survival of humanity. Hyperrealism, semantic algebra, naiveté...", "NOTA BENE", "The need to create this work arose after listening to Geoffrey Hinton's Nobel Prize in Physics acceptance speech in 2024—the content of which I feel is important to share—, and perhaps influenced by my prior reading of Benjamin Labatut's literary-scientific works.", "Furthermore, I have always worked with my own materials, and currently, I was very interested in experimenting with the tools available to us in this time of paradigm shifts across all fields, and this topic seemed very appropriate for such an endeavor.", "Geoffrey Hinton (British), along with Yoshua Bengio (Canadian) and Yann LeCun (French-American), are known as the \"Fathers of AI\": they received the Turing Award [in computer science] in 2018. Geoffrey Hinton and John Hopfield have been awarded the 2024 Nobel Prize in Physics for their studies in the field of machine learning and deep learning, which has laid the foundations of artificial intelligence. Bengio and Hinton have taken a very critical and active stance regarding how their discoveries will be used and warn us of real threats and the urgent need to take measures such as requiring companies that train models to conduct risk assessments before implementation. Yann LeCun, for his part, now holds a prominent position at META and will soon launch his own startup, focused on Advanced Artificial Intelligence (AMI) research.", "Benjamín Labatut is a Chilean-Dutch writer, author of After the Light, The Stone of Madness, A Terrible Greenness/When We Cease to Understand the World, Maniac..., and other literary essays about exceptional scientists, their genius, and their delusions. Related to the subject, he shares his opinion in this interview about the potential impact of artificial intelligence."], "t_ua": "Дерево пізнання добра і зла", "t_en": "The Tree of the Knowledge of Good and Evil", "imgs": ["img/p11.webp"], "en_draft": false, "id": "w15", "name_ua": "Лізі Прада", "name_en": "Lisi Prada", "sub_ua": "", "sub_en": "", "dur_ua": "3:14", "dur_en": "3:14", "audio_ua": "a/ua/w15-750ef77c.mp3", "audio_en": "a/en/w15-50cc274f.mp3", "ig": ["lisiprada"]}, {"n": 16, "fmt_ua": "двоканальна відеоінсталяція", "fmt_en": "two-channel video installation", "year": "", "ua_text": ["Двоканальна відеоінсталяція, створена в межах резиденції «Простір присутності» (Carbon, Ніцца). З правого боку — документація фізичного процесу створення меблів як спроби тілесного вкорінення та фізичного контакту із середовищем. З лівого — віртуальна 3D-модель об'єкта. Робота досліджує межу між цифровою та фізичною присутністю, де буденний акт полагодження ліжка стає пошуком опори й стабільності."], "en_text": ["A two-channel video installation created during the “Space of Presence” residency (Carbon, Nice). On the right: documentation of the physical process of making furniture, an attempt at bodily rootedness and physical contact with the environment. On the left: a virtual 3D model of the object. The work explores the boundary between digital and physical presence, where the everyday act of mending a bed becomes a search for support and stability."], "t_ua": "Ліжко", "t_en": "Bed", "imgs": ["img/p02.webp"], "en_draft": false, "id": "w16", "name_ua": "Євген Кіннота", "name_en": "Yevhen Kinnota", "sub_ua": "", "sub_en": "", "dur_ua": "1:20", "dur_en": "1:20", "audio_ua": "a/ua/w16-00fe9259.mp3", "audio_en": "a/en/w16-1da02d39.mp3", "ig": ["yevhen.kinnota"]}, {"n": 17, "fmt_ua": "експериментальний короткометражний фільм, ч/б, звук 5.1", "fmt_en": "experimental short film, b/w, 5.1 sound", "year": "", "ua_text": ["Опираючись розпаду, тіла залишаються завислими в темряві. У цьому проміжному місці, поза простором і часом, співіснують живі й мертві… тоді як клінічний погляд розтинає їхні тіла в пошуках сліду життя, знаку смерті. «Якщо я досить довго триматиму очі заплющеними, я буду там». Фільм виник із запитання авторки, де перебувала її мати, коли хвороба й ліки ніби стирали її свідомість із тіла. Знятий тепловізійною камерою, фільм перетворює тіла на тепло і світло — технологічний погляд стає посередником між фізично присутнім і невидимим."], "en_text": ["As they resist collapse, the bodies remain suspended in darkness. In that in-between place, beyond space and time, the living and the dead coexist… while a clinical gaze dissects their bodies, searching for a vestige of life, a sign of death. “If I close my eyes long enough, I am there.” The film emerged from wondering where the artist's mother was when illness and medication seemed to make her consciousness disappear from her body. Shot with a thermal camera, it translates bodies into heat and light — a technological gaze that mediates between what is physically present and what remains invisible."], "t_ua": "This is an Autopsy", "t_en": "This is an Autopsy", "imgs": ["img/p23.webp"], "en_draft": false, "id": "w17", "name_ua": "Лусія Сельва", "name_en": "Lucía Selva", "sub_ua": "", "sub_en": "", "dur_ua": "10:46", "dur_en": "10:46", "audio_ua": "a/ua/w17-8f1f14ee.mp3", "audio_en": "a/en/w17-671748d2.mp3", "ig": ["luciaselva____"]}, {"n": 18, "fmt_ua": "анімаційний фільм-есе", "fmt_en": "animated essay film", "year": "2024–2025", "ua_text": ["Анімаційний фільм-есе про втрату дому та пошук нового відчуття приналежності. Через особисту історію мисткиня досліджує, як вимушена зміна середовища трансформує уявлення про дім, пам'ять, безпеку та власну ідентичність. Фільм складається із семи розділів, кожен із яких розглядає інший аспект поняття дому. Це спроба зрозуміти, що ми втрачаємо разом із домом, що забираємо із собою і чи можна заново сформувати відчуття дому в реальності, яка вже змінилася."], "en_text": ["An animated essay film about losing one's home and searching for a new sense of belonging. Through a personal story, the artist explores how a forced change of environment transforms one's understanding of home, memory, safety and identity. The film consists of seven chapters, each examining a different aspect of the idea of home. It is an attempt to understand what we lose along with our home, what we take with us, and whether a sense of home can be rebuilt in a reality that has already changed."], "t_ua": "Мій Дом", "t_en": "My Home", "imgs": ["img/p17.webp"], "en_draft": false, "id": "w18", "name_ua": "Машика Вишедська", "name_en": "Mariia Vyshedska", "sub_ua": "", "sub_en": "", "dur_ua": "19:20", "dur_en": "19:20", "audio_ua": "a/ua/w18-b1ac4d13.mp3", "audio_en": "a/en/w18-45a4678a.mp3", "ig": ["mashikas_art"]}, {"n": 19, "fmt_ua": "фотографічний проєкт, показ у форматі відео", "fmt_en": "photographic project shown as video", "year": "2025", "ua_text": ["Фотографічний проєкт, у якому авторка досліджує внутрішню трансформацію людини в умовах війни, втрати та постійної невизначеності: як людина змінюється, коли звичний світ руйнується, і як водночас намагається зберегти в собі відчуття безперервності. Через автопортрет, ландшафт, тілесну присутність, символи та фотографічний образ вона створює своєрідний архів неіснуючого світу — слідів пам'яті, травми, надії та уяви. Фотографія стає не лише способом фіксації реальності, а інструментом її переосмислення. The Surviving World говорить про момент, коли виживання перестає бути лише пристосуванням до обставин і стає процесом створення нового способу бути. Це пошук не повернення до колишнього світу, а можливості створити вцілілий світ усередині себе."], "en_text": ["A photographic project exploring a person's inner transformation amid war, loss and constant uncertainty: how one changes when the familiar world collapses, while trying to preserve a sense of continuity. Through self-portraiture, landscape, bodily presence, symbols and the photographic image, the artist creates an archive of a non-existent world — traces of memory, trauma, hope and imagination. Photography becomes not only a way of recording reality but a tool for rethinking it. The Surviving World speaks of the moment when survival stops being mere adaptation and becomes the creation of a new way of being. It is a search not for a return to the former world, but for the possibility of creating a surviving world within oneself."], "t_ua": "The Surviving World", "t_en": "The Surviving World", "imgs": ["img/p21.webp"], "en_draft": false, "id": "w19", "name_ua": "Юлія Шибіркіна", "name_en": "Yuliia Shybirkina", "sub_ua": "", "sub_en": "", "dur_ua": "2:00", "dur_en": "2:00", "audio_ua": "a/ua/w19-b2faa3b1.mp3", "audio_en": "a/en/w19-7461e2b2.mp3", "ig": ["shybirkina"]}, {"n": 20, "fmt_ua": "відео", "fmt_en": "video", "year": "2026", "ua_text": ["Візуальний рядок поєднує несумісні раніше пласти: спорт/дозвілля (ролики), військову необхідність (зброя, антидронова сітка) та віртуальний екран (VR).", "Монохромна естетика та інверсія світла перетворюють фізичне середовище на графічний спостереження. Людина більше не обирає між цифровим і фізичним світом — вона існує всередині їхньої гібридної напруги, де рух уперед залишається єдиним способом зберегти контроль.", "На роликах — Костя Пірат. Оригінальний саундтрек — Єгор GORE."], "en_text": ["The visual sequence brings together layers that were previously incompatible: sport and leisure (rollerblades), military necessity (weapons, anti-drone netting) and the virtual screen (VR).", "Monochrome aesthetics and inverted light turn the physical environment into a graphic of surveillance. A person no longer chooses between the digital and the physical world — they exist inside their hybrid tension, where moving forward remains the only way to stay in control.", "On rollerblades — Kostia Pirat. Original soundtrack — Yehor GORE."], "t_ua": "Гібридна напруга", "t_en": "Hybrid Tension", "en_draft": true, "imgs": ["img/p13.webp"], "id": "w20", "name_ua": "Вадим Махітка", "name_en": "Vadym Makhitka", "sub_ua": "", "sub_en": "", "dur_ua": "4:26", "dur_en": "4:26", "audio_ua": "a/ua/w20-c9c88ef7.mp3", "audio_en": "a/en/w20-07d560d1.mp3", "ig": ["vadymmakhitka"]}, {"n": 21, "t_ua": "Світло присутності", "t_en": "Light of Presence", "fmt_ua": "експериментальне відео", "fmt_en": "experimental video", "year": "2025", "ua_text": ["Інтимна історія про зв’язок між двома людьми. Дія фільму розгортається у віртуальному коридорі-галереї, наповненому особистим відеоархівом пари за 2024–2025 роки. Архівні фрагменти зливаються у рухливу експозицію, що триває лише доти, доки на неї спрямований погляд глядача.", "Цей коридор стає простором близькості: минуле розкривається через жести, світло та миттєві доторки до моментів. Коли зображення зникають, не залишається жодного кадру — лише відчуття присутності, до якого можна повернутися.", "Фільм досліджує альтернативний спосіб архівування пам'яті. Уявний простір віддалено нагадує стару відеогру: ми подорожуємо не між файлами, а між станами та зафіксованими спогадами. Архів не зберігається — він проживається, повільно розгортаючись і трансформуючись під час кожного перегляду."], "en_text": ["An intimate story about the bond between two people. The film unfolds in a virtual corridor-gallery filled with the couple's personal video archive recorded in 2024–2025. Archival fragments merge into a moving exhibition that lasts only as long as the viewer's gaze is directed at it.", "The corridor becomes a space of closeness: the past is revealed through gestures, light and fleeting touches of moments. When the images disappear, not a single frame remains — only a sense of presence one can return to.", "The film explores an alternative way of archiving memory. The imaginary space faintly resembles an old video game: we travel not between files but between states and recorded memories. The archive is not stored — it is lived, slowly unfolding and transforming with every viewing."], "imgs": ["img/p15.webp"], "en_draft": false, "id": "w21", "name_ua": "Влад Третяк", "name_en": "Vlad Tretiak", "sub_ua": "", "sub_en": "", "dur_ua": "3:43", "dur_en": "3:43", "audio_ua": "a/ua/w21-047f012e.mp3", "audio_en": "a/en/w21-4bbeb632.mp3", "ig": ["tretiakvladislav.i"]}, {"n": 22, "fmt_ua": "серія коротких відео, рукотворна анімація", "fmt_en": "series of short handmade videos", "year": "", "ua_text": ["Серія невеликих відео, зроблених вручну, була однією з перших спроб оговтати свою психіку після повномасштабного вторгнення. Вони є частинками особистої взаємодії зі світом, його бачення розвитку та обміну енергією. Відео піднімають тему органічності співіснування механічної та біологічної частин світу."], "en_text": ["A series of small handmade videos that were among the artist's first attempts to restore his mental balance after the full-scale invasion. They are fragments of a personal interaction with the world, its vision of development and exchange of energy. The videos address the organic coexistence of the mechanical and biological parts of the world."], "t_ua": "Серія коротких відео", "t_en": "Series of short videos", "imgs": ["img/p19.webp"], "en_draft": false, "id": "w22", "name_ua": "Юро Кам", "name_en": "Yuro Kam", "sub_ua": "", "sub_en": "", "dur_ua": "0:15", "dur_en": "0:15", "audio_ua": "a/ua/w22-fc289a20.mp3", "audio_en": "a/en/w22-cd63de4c.mp3", "ig": ["yuro_kam"]}, {"n": 23, "t_ua": "Щоденник літа", "t_en": "Summer Diaries", "fmt_ua": "відео", "fmt_en": "video", "year": "", "ua_text": ["Цього літа всього було вдосталь. Пигулок шоб пити, книжок шоб читати, можна було б трохи більше плівки для фоток."], "en_text": ["This summer there was plenty of everything. Pills to take, books to read — though a little more film for photos wouldn't have hurt."], "en_draft": true, "imgs": ["img/p27e.webp"], "id": "w23", "name_ua": "Володимир Колбаса", "name_en": "Volodymyr Kolbasa", "sub_ua": "", "sub_en": "", "dur_ua": "1:30 у циклі", "dur_en": "1:30, looped", "audio_ua": "a/ua/w23-5f6f0bfb.mp3", "audio_en": "a/en/w23-c7bdfdbd.mp3", "ig": ["volodymyrkolbasa"]}, {"n": 24, "fmt_ua": "інтерактивний вебсайт, цифрова містифікація", "fmt_en": "interactive website, digital mystification", "year": "", "ua_text": ["Художня містифікація на перетині постправдивих наративів, територіальної екології та цифрової пам'яті. Проєкт представляє вигадане українське місто через його головний артефакт — муніципальний вебсайт, капсулу часу врядування початку 2000-х, що велася з 3 лютого 2003 до 21 грудня 2012 року. Місто розташоване на поліських болотах; наслідки Чорнобиля визначають його долю: занепад інфраструктури, скорочення населення, незрозумілі явища, пов'язані з аномаліями радіохвиль. Сайт з його естетикою, бюрократичною мовою та буденними оголошеннями про футбольні матчі й вакансії «виконує» реальність міста. Чи існувало воно — другорядне; важливо зрозуміти, як форма породжує віру. Це проєкт про те, як місця продовжують існувати в архіві, як забруднення стає наративом і як вигадані території можуть розкривати правду про реальні."], "en_text": ["An artistic mystification at the intersection of post-truth narratives, territorial ecology and digital memory. The project presents a fictional Ukrainian town through its primary artefact — a municipal website, a time capsule of early-2000s governance recorded between 3 February 2003 and 21 December 2012. The town lies in the Polissia marshlands; the aftermath of Chornobyl drives its trajectory: infrastructure decay, population decline and unexplained phenomena linked to radio-wave anomalies. With its aesthetic codes, bureaucratic tone and mundane announcements about football matches and job postings, the website performs the reality of a town. Whether that town existed is secondary to understanding how form generates belief. It is a project about how places persist in the archive, how contamination becomes narrative, and how fictional territories can reveal truths about real ones."], "t_ua": "Герцівка", "t_en": "Hertsivka", "imgs": ["img/p14.webp"], "en_draft": false, "id": "w24", "name_ua": "MOLEKULtur", "name_en": "MOLEKULtur", "sub_ua": "Софія Золочевська та Анастасія Євстратенко", "sub_en": "Sophie Zolochevska & Anastasiia Yevstratenko", "dur_ua": "вільний, інтерактивний перегляд", "dur_en": "open, interactive browsing", "audio_ua": "a/ua/w24-8cf9287e.mp3", "audio_en": "a/en/w24-056c9d59.mp3", "ig": ["molekultur"]}, {"n": 25, "fmt_ua": "генеративна AI-інсталяція в реальному часі (Stable Diffusion 1.4)", "fmt_en": "real-time generative AI installation (Stable Diffusion 1.4)", "year": "", "ua_text": ["Три зображення з'являються поруч. Їхня близькість натякає на зв'язок — і глядач починає його вибудовувати.", "У Things Fall Apart CyberRäuber генерують на великій LED-стіні триптих, що постійно змінюється, використовуючи фрагменти вірша В. Б. Єйтса «Друге пришестя» та давнього гностичного тексту «Грім, досконалий розум». Інсталяція свідомо використовує Stable Diffusion 1.4 — ранню модель «текст-у-зображення», чиї нестабільні фігури та незавершені деталі опираються відшліфованості сучасних ШІ-зображень.", "Кожна панель пропонує іншу візуальну інтерпретацію тих самих слів. У зображеннях і накладених на них віршах виникають зв'язки, які не складаються в єдиний наратив. Образи лишаються відкритими до інтерпретації, але не вільними від успадкованих уявлень: і модель, і глядач приносять у цю зустріч культурно сформовані способи бачення.", "На тлі текстових видінь потрясіння, одкровення та суперечливої ідентичності інсталяція запитує: коли наше прагнення знайти сенс перетворюється на тугу за порядком — чи за спасителем, — у якого можна вірити?", "Зображення генеруються впродовж кожного 28-хвилинного циклу, а потім видаляються. Послідовність повертається, її зображення — ні. Композиція Міхи Каплана зі співаним і промовленим текстом може супроводжувати інсталяцію, додаючи ще один шар асоціацій. Відвідувачі можуть увійти, вийти й повернутися будь-коли.", "КОНТЕКСТ — «Друге пришестя», гностичний текст і різні версії", "Музичний і візуальний контекст ґрунтуються на вірші В. Б. Єйтса «Друге пришестя», написаному 1919 року: він описує світ у сум'ятті та реакцію на нього — світу загалом і кожного з нас. Що тримає нас разом, яку роль кожен із нас відіграє в нинішньому стані речей, на яких месіанських постатей ми чекаємо, щоб усе знову стало добре? Вірш використовує християнські образи Апокаліпсису та Другого пришестя, щоб алегорично описати атмосферу повоєнної Європи та пандемії грипу 1918–1919 років, під час якої ледь не померла вагітна дружина автора. Його вважають одним із головних творів модерністської поезії.", "Другорядним джерелом натхнення є «Грім, досконалий розум» — гностичний текст III століття. Він говорить про божественне парадоксально: як про шановане й прокляте водночас, як про життя і смерть, як про причину і миру, і війни. Вірш також наголошує, що божественне існує і всередині, і поза людиною, а її суд і спасіння залежать від її стосунку з божественним.", "Музику створили спеціально для попереднього однойменного проєкту, прем'єра якого відбулася на головній сцені другого за величиною оперного театру Європи (Festspielhaus Baden-Baden) у розпал пандемії Covid-19 навесні 2021 року — перед 2500 порожніми кріслами. Згодом проєкт отримав відому премію Junge Ohren-Preis 2021.", "Спочатку робота була задумана як одноразовий живий перформанс, у якому митці виступали на віртуальних і реальних сценах. Але 2022 року ми вирішили переробити її в основу для нової ідеї: дослідити вірш і його теми за допомогою найсучасніших штучних нейронних мереж і знову зробити це дослідження доступним для груп людей одночасно — у спільному просторі змішаної реальності. Музична послідовність і драматургія задані наперед, але відвідувачі — кожен окремо і як група — можуть обирати власну взаємодію, інтереси та шляхи крізь перформанс / інсталяцію, формуючи власну перспективу.", "Немає правильного чи неправильного способу пережити версію Things Fall Apart у змішаній реальності. І хоча музика також чудово створює спільну атмосферу та допомагає зосередитися на інсталяції, ми вітаємо обмін думками й розмови відвідувачів між собою під час і після перформансу.", "Певною мірою саме досвід попередніх версій Things Fall Apart і переконання, що їхні теми та складники досі дуже актуальні, привели нас до цього нового видання — автономної аудіовізуальної інсталяції, яка не потребує постійного нагляду й підходить для показу у звичайних галерейних і музейних просторах."], "en_text": ["Three images appear side by side. Their proximity suggests a connection; the viewer begins to make one.", "In Things Fall Apart, CyberRäuber generate a continually changing triptych on a large LED wall, using fragments from W. B. Yeats’s The Second Coming and the ancient Gnostic text The Thunder, Perfect Mind. The installation deliberately uses Stable Diffusion 1.4, an early text-to-image model whose unstable figures and unresolved details resist the polished finish of contemporary AI imagery.", "Each panel offers a different visual interpretation of the same words. Across images and overlaid verses, connections emerge without settling into a single narrative. The images remain open to interpretation, but not free of inherited assumptions: both model and viewer bring culturally shaped ways of seeing to the encounter.", "Against the texts’ visions of upheaval, revelation and contradictory identity, the installation asks: when does our impulse to find meaning become a longing for an order—or a saviour—to believe in?", "Images are generated throughout each 28-minute cycle, then deleted. The sequence returns; its images do not. Micha Kaplan’s composition, incorporating sung and spoken text, can accompany the installation, adding another layer of association. Visitors may enter, leave and return at any point.", "CONTEXT - The Second Coming, Gnostic Text and different versions", "The musical and visual context are based on W. B. Yeats' poem \"The Second Coming\", written in 1919 and describing a world in turmoil and the world's - and our individual - reaction to it. What holds us together, what part do we individually play in the state of things, what messianic figures do we expect to make everything right again? The poem uses Christian imagery regarding the Apocalypse and Second Coming to describe allegorically the atmosphere of post-war Europe and the 1918-19 flu pandemic, in which the author's pregnant wife almost died. It is considered a major work of modernist poetry.", "The Thunder, Perfect Mind, a gnostic text from the third century, is a secondary inspiration. It speaks about the divine in paradoxical terms, as both honored and cursed, as life and death, and as both the cause of peace and war. The poem also emphasizes the idea that the divine exists both inside and outside of oneself, and that one's judgment and salvation are dependent on their relationship to the divine.", "The music was created specifically for an earlier project with the same name, which premiered on the main stage of Europe's second largest opera house (Festspielhaus Baden-Baden) on the height of the Covid-19 pandemic in spring 2021 in front of 2500 empty seats, and later was awarded with the renowned Junge Ohren-Preis 2021.", "So at first the work was conceptualized as a one-time live performance with artists performing on virtual and real stages, but in 2022 we decided to re-work it into the foundation for a new idea: to create an exploration of the poem and its topics by state-of-the-art artificial neural networks and to make this exploration again explorable for groups of people at the same time in a shared mixed reality space. While the musical sequence and dramaturgy is predetermined, individually and as a group visitors can choose their own interaction, interests and paths through the performance / installation, develop their own perspective.", "There is no right or wrong way to experience the mixed reality version of Things Fall Apart and - while the music also functions as a great means to create a shared atmosphere and focus on the installation - we welcome the interchange and conversations of visitors with each other during and after the performance.", "In a way, our experience with the earlier versions of Things Fall Apart, and the conviction that their topics and components are still very much relevant, lead us to this new edition, a self-running audiovisual installation requiring no ongoing supervision, suitable for presentation in conventional gallery and museum settings."], "t_ua": "Усе розпадається", "t_en": "Things Fall Apart", "imgs": ["img/p10.webp"], "en_draft": false, "id": "w25", "name_ua": "CyberRäuber", "name_en": "CyberRäuber", "sub_ua": "Марсель Карнапке та Б'єрн Ленгерс", "sub_en": "Marcel Karnapke & Björn Lengers", "dur_ua": "цикл 28:44", "dur_en": "28:44 cycle", "audio_ua": "a/ua/w25-dbcf936f.mp3", "audio_en": "a/en/w25-4bd6b08c.mp3", "ig": ["cyberraeuber"]}, {"n": 26, "id": "w26", "t_ua": "Бути собою", "t_en": "Be yourself", "fmt_ua": "анімація", "fmt_en": "animation", "year": "2019–2026", "ua_text": ["Проект проводить глибинний аналіз людської підсвідомості, де є те, чого не можеш висловити словами. Ззовні людина може знівелювати власними почуттями, одягнувши бетонні маски та рожеві окуляри, однак душа цього не приховає. Роботи можна переглядати, як багатосерійний фільм, з однією сюжетною лінією, де в кожній серії вирішуються нові питання та проблеми. Його можна віднести, як до соціального, так і до автобіографічного проекту. Емоційне виконання робіт, прикметна недбалість та наївність дає зрозуміти, що образи є щирими, дещо хаотичними, але у цьому хаосі є своя гармонія."], "en_text": ["The project offers a deep analysis of the human subconscious, where there is something that cannot be put into words. Outwardly, a person can suppress their own feelings by putting on concrete masks and rose-tinted glasses, but the soul cannot hide it. The works can be viewed as a multi-episode film with a single storyline, where each episode addresses new questions and problems. It can be considered both a social and an autobiographical project. The emotional execution of the works, their characteristic carelessness and naivety make it clear that the images are sincere, somewhat chaotic, yet there is a harmony of its own in this chaos."], "en_draft": true, "imgs": ["img/p20.webp"], "name_ua": "Наталія Федоришин", "name_en": "Nataliia Fedoryshyn", "sub_ua": "", "sub_en": "", "dur_ua": "4:38", "dur_en": "4:38", "audio_ua": "a/ua/w26-85768d0e.mp3", "audio_en": "a/en/w26-870221c7.mp3", "ig": ["fedoryshyn_arthouse"]}];

const ICON_PAUSE = '<svg viewBox="0 0 10 12" aria-hidden="true"><path d="M1 0h3v12H1zM6 0h3v12H6z"/></svg>';
const mmss = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";

  const sync = () => { tm.textContent = au.currentTime ? `${mmss(au.currentTime)} / ${mmss(au.duration)}` : mmss(au.duration);
                       if (au.duration) seek.value = Math.round(au.currentTime / au.duration * 1000); };

  if (!SPEEDS.includes(rate)) rate = 1;

                         spd.setAttribute("aria-label", `${t.speed} ×${r}`); try { localStorage.setItem("metanoia-rate", r); } catch(e) {} };
  setRate(rate);
  spd.onclick = () => setRate(SPEEDS[(SPEEDS.indexOf(rate) + 1) % SPEEDS.length]);

}
function route() {
